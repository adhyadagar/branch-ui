name: Bug report
description: Something doesn't work the way the README says it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help on a canvas app.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Model setup
      options:
        - Demo mode (no key)
        - Anthropic API key
        - Vercel AI Gateway
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and browser.
      placeholder: Node 22, macOS 15, Chrome 142
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output from `npm run dev`, or browser console errors. Remove any API keys first.
      render: text
