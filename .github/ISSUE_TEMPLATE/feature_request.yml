name: Feature request
description: Suggest an idea for Branch
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The thing you're trying to think through or get done, and where Branch gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for it, if you have one.
